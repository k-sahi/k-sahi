<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <!-- floor -->
  <ellipse cx="300" cy="418" rx="265" ry="16" fill="#e8ecf4"/>

  <!-- floating code lines -->
  <g fill="#b8c4f0">
    <rect x="60" y="62" width="40" height="5" rx="2"/>
    <rect x="108" y="62" width="70" height="5" rx="2"/>
    <rect x="60" y="76" width="25" height="5" rx="2"/>
    <rect x="93" y="76" width="95" height="5" rx="2"/>
    <rect x="60" y="90" width="55" height="5" rx="2"/>
    <rect x="123" y="90" width="45" height="5" rx="2"/>
    <rect x="60" y="104" width="35" height="5" rx="2"/>
    <rect x="103" y="104" width="80" height="5" rx="2"/>
    <rect x="60" y="118" width="20" height="5" rx="2"/>
    <rect x="88" y="118" width="60" height="5" rx="2"/>
    <rect x="215" y="66" width="110" height="5" rx="2"/>
    <rect x="235" y="80" width="80" height="5" rx="2"/>
    <rect x="225" y="94" width="95" height="5" rx="2"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- gear speech bubble -->
  <g>
    <rect x="335" y="34" width="58" height="50" rx="9" fill="#3b82f6"/>
    <path d="M350 84 L346 98 L362 84 Z" fill="#3b82f6"/>
    <g fill="none" stroke="#ffffff" stroke-width="4">
      <circle cx="357" cy="56" r="8" stroke-dasharray="4 2.3">
        <animateTransform attributeName="transform" type="rotate" from="0 357 56" to="360 357 56" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="375" cy="66" r="6" stroke-dasharray="3 2.3">
        <animateTransform attributeName="transform" type="rotate" from="360 375 66" to="0 375 66" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- desk -->
  <rect x="70" y="266" width="9" height="150" fill="#8b93a7"/>
  <rect x="352" y="266" width="9" height="150" fill="#8b93a7"/>

  <!-- monitor 1 -->
  <rect x="108" y="228" width="14" height="22" fill="#2b2f3a"/>
  <rect x="90" y="247" width="50" height="7" rx="2" fill="#2b2f3a"/>
  <rect x="58" y="150" width="114" height="82" rx="5" fill="#3b5bdb"/>
  <rect x="64" y="156" width="102" height="70" rx="2" fill="#dbe3ff"/>
  <g fill="#3a3f4b">
    <rect x="70" y="164" width="30" height="4"/><rect x="104" y="164" width="40" height="4"/>
    <rect x="70" y="173" width="18" height="4"/><rect x="92" y="173" width="55" height="4"/>
    <rect x="70" y="182" width="40" height="4"/><rect x="114" y="182" width="30" height="4"/>
    <rect x="70" y="191" width="24" height="4"/><rect x="98" y="191" width="50" height="4"/>
    <rect x="70" y="200" width="35" height="4"/><rect x="70" y="209" width="50" height="4"/>
  </g>

  <!-- monitor 2 -->
  <rect x="232" y="232" width="14" height="18" fill="#2b2f3a"/>
  <rect x="214" y="247" width="50" height="7" rx="2" fill="#2b2f3a"/>
  <rect x="180" y="140" width="124" height="94" rx="5" fill="#3b5bdb"/>
  <rect x="186" y="146" width="112" height="82" rx="2" fill="#c5d0fa"/>
  <rect x="194" y="154" width="56" height="36" fill="#2b2f3a"/>
  <rect x="226" y="176" width="64" height="42" fill="#3a3f4b" stroke="#c5d0fa" stroke-width="2"/>
  <g fill="#c5d0fa">
    <rect x="232" y="184" width="40" height="3"/>
    <rect x="232" y="192" width="28" height="3"/>
    <rect x="232" y="200" width="46" height="3"/>
    <rect x="264" y="192" width="3" height="8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- monitor 3 (partly behind her) -->
  <rect x="306" y="152" width="80" height="80" rx="5" fill="#3b5bdb"/>
  <rect x="312" y="158" width="68" height="68" rx="2" fill="#a5b4fc"/>

  <!-- desk top + keyboard -->
  <rect x="48" y="254" width="336" height="13" rx="4" fill="#c5d0fa"/>
  <rect x="198" y="248" width="84" height="6" rx="2" fill="#2b2f3a"/>

  <!-- chair -->
  <rect x="404" y="150" width="76" height="150" rx="32" fill="#4b5563"/>
  <rect x="398" y="158" width="16" height="136" rx="8" fill="#3b82f6"/>
  <rect x="335" y="298" width="132" height="15" rx="7" fill="#6b7280"/>
  <rect x="394" y="313" width="12" height="70" fill="#4b5563"/>
  <rect x="345" y="381" width="112" height="9" rx="4" fill="#374151"/>
  <circle cx="352" cy="398" r="8" fill="#1f2937"/>
  <circle cx="450" cy="398" r="8" fill="#1f2937"/>

  <!-- legs -->
  <rect x="316" y="296" width="20" height="108" rx="6" fill="#2b3647"/>
  <ellipse cx="312" cy="407" rx="22" ry="7" fill="#111827"/>
  <path d="M300 280 Q296 296 304 304 L408 304 Q414 292 408 280 Z" fill="#1f2937"/>
  <rect x="290" y="292" width="22" height="112" rx="6" fill="#1f2937"/>
  <ellipse cx="288" cy="409" rx="24" ry="8" fill="#0b1220"/>

  <!-- torso (pink top) -->
  <path d="M366 198 Q424 202 418 262 L412 300 L348 300 Q342 248 366 198 Z" fill="#e879a6"/>
  <path d="M398 205 Q424 220 418 262 L412 300 L396 300 Q404 250 398 205 Z" fill="#d6588e"/>

  <!-- neck -->
  <rect x="356" y="178" width="16" height="24" rx="4" fill="#f2c4a2"/>

  <!-- typing arm -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0;0 -1.5;0 0" dur="0.6s" repeatCount="indefinite"/>
    <path d="M372 214 L336 246" stroke="#e879a6" stroke-width="20" stroke-linecap="round"/>
    <path d="M336 246 L292 246" stroke="#f2c4a2" stroke-width="12" stroke-linecap="round"/>
    <circle cx="288" cy="245" r="7.5" fill="#f2c4a2"/>
  </g>

  <!-- head -->
  <circle cx="358" cy="156" r="27" fill="#f2c4a2"/>
  <ellipse cx="339" cy="156" rx="3" ry="4" fill="#2b1d1a"/>
  <path d="M334 150 L331 147 M337 149 L335 145 M340 149 L340 145" stroke="#2b1d1a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M334 170 Q340 174 346 170" stroke="#b5485f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="348" cy="164" r="4" fill="#f4a3a8" opacity="0.6"/>
  <!-- hair: dark, wavy, shoulder length -->
  <path d="M333 148 Q330 118 362 116 Q396 116 396 150 Q398 172 404 192 Q412 210 404 222 Q394 228 386 216 Q392 204 384 192 Q378 180 376 166 Q372 152 362 146 Q350 142 342 152 Q338 156 333 148 Z" fill="#2b1d1a"/>
  <path d="M340 132 Q356 124 372 136" stroke="#4a332c" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- waste basket -->
  <rect x="495" y="362" width="52" height="50" fill="#bfdbfe"/>
  <g stroke="#3b82f6" stroke-width="1.5">
    <path d="M495 372 L547 372 M495 384 L547 384 M495 396 L547 396 M505 362 L505 412 M518 362 L518 412 M531 362 L531 412"/>
  </g>
  <rect x="490" y="356" width="62" height="8" rx="2" fill="#3b82f6"/>
  <rect x="493" y="410" width="56" height="6" rx="2" fill="#3b82f6"/>
</svg>
